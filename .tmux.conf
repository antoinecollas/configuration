set -g mouse on

# Hold mouse selections until an explicit copy.
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# Pair with iTerm2's Cmd+C "Send Hex Code: 0x03" key mapping.
bind -T copy-mode C-c send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel
